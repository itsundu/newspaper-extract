name: Deploy frontend to Hostinger

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          port: 65002
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local_path: "./frontend/*"
          remote_path: "/home/u200117769/domains/terralytixai.com/public_html/listings"
          sftp_only: true
