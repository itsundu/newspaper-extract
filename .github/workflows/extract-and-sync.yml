name: Extract listings and sync to Supabase

on:
  push:
    branches: [main]
    paths:
      - "mylaporetimes/**.pdf"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: extract-and-sync
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run extraction pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python unified_newspaper_extraction2.py

      - name: Commit updated CSV and processed log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add structured_real_estate_accumulated.csv processed_pdfs.txt
          git diff --cached --quiet || git commit -m "Auto-update extracted listings [skip ci]"
          git push
